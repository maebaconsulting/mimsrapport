[package]
name = "reporting-manar"
version = "0.1.1"
description = "MIMS REPORTING · application desktop de reporting pour société de bourse CEMAC/BVMAC"
authors = ["Maeba Consulting"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Le suffixe `_lib` rend le nom de la lib unique pour éviter un conflit avec le binaire
# (problème spécifique à Windows, voir https://github.com/rust-lang/cargo/issues/8519).
name = "reporting_manar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
