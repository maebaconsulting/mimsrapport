name: CI

# Tests rapides sur chaque push / pull request : compilation frontend + tests
# unitaires, golden-file et rendu réel des gabarits. Le test d'intégration
# PocketBase (gated par PB_INTEGRATION) n'est pas joué ici (nécessite le binaire).

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Compilation (tsc + vite)
        run: pnpm build

      - name: Tests (unitaires + golden-file + rendu réel)
        run: pnpm test
