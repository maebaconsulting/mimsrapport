name: Release Windows

# Déclenchée par un tag vX.Y.Z. Construit les installeurs Windows (.msi / .exe)
# sur un runner Windows (Tauri ne cross-compile pas confortablement Mac → Windows)
# et les attache à la release GitHub.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Chaîne Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances frontend
        run: pnpm install --frozen-lockfile

      - name: Récupération du binaire PocketBase (version figée)
        run: pwsh ./scripts/fetch-pocketbase.ps1

      - name: Build Tauri (msi + nsis)
        run: pnpm tauri build

      - name: Publication des installeurs sur la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
